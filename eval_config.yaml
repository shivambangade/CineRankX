# CineRankX evaluation config
# Exact metric names from the approved KPI table — use these names verbatim
# in src/evaluation/ so report/slide numbers match the code that produced them.

search:
  metrics:
    - "Precision@10"
    - "Recall@10"
    - "MRR"
    - "NDCG"
    - "Search Latency"

recommendation:
  k_values: [5, 10, 20]     # tune as needed; used for Precision@K / Recall@K
  metrics:
    - "Precision@K"
    - "Recall@K"
    - "F1"
    - "MAP"
    - "Coverage"
    - "Diversity"
    - "Novelty"
    - "Cold-Start Accuracy"

machine_learning:
  # Applies to the Adaptive ML Strategy Selection Engine's classifier
  metrics:
    - "Accuracy"
    - "Precision"
    - "Recall"
    - "F1"
    - "ROC-AUC"
    - "Confusion Matrix"

system:
  metrics:
    - "Response Time"
    - "Memory Usage"
    - "CPU Usage"
    - "Throughput"

ranking_objectives:
  # Relevance gate for the IR candidate source. TF-IDF over
  # overview + genres + keywords can rank a horror film highly against an
  # animated family film purely on a shared keyword ("toy"). This attenuates a
  # candidate's IR relevance in proportion to how little genre overlap it has
  # with the seed movie it was retrieved from.
  #   floor = multiplier applied at ZERO genre overlap.
  #   1.0 disables the gate entirely; 0.0 drops zero-overlap candidates outright.
  # Only affects content/IR candidates -- collaborative and popularity
  # candidates have no seed movie to compare against.
  genre_relevance_gate:
    floor: 0.25

  # The Multi-Objective Hybrid Ranking Engine's six weighted objectives.
  # Keep these as tunable config, never hardcoded in the ranking logic.
  weights:
    relevance: 0.30
    diversity: 0.15
    novelty: 0.15
    coverage: 0.10
    popularity_quality: 0.15
    predicted_rating: 0.15

strategy_selector:
  # Labelling and evaluation settings for the Adaptive Strategy Selector.
  #   label_top_n / holdout_fraction: independent re-labelings of the same users agree only ~61%
#   at top-10 / 20% holdout and ~66-79% with a larger budget / holdout, so these set how
#   reliable (and how accuracy-bounded) the labels are.
# holdout_fraction: share of each user's ratings hidden from BOTH the profile
  #   features and the strategy backtest's training data; it is the backtest's
  #   test set, so features can never see the ratings that decided the label.
  # label_margin: a user is kept only if the best strategy's hit-rate beats the
  #   runner-up by at least this much (hit-rates are in [0, 1]). All-zero users
  #   are always dropped. 0 keeps every user that has a strict winner.
  holdout_fraction: 0.3
  label_margin: 0.02
  label_top_n: 30          # recommendation budget each strategy gets in the label backtest
  inner_splits: 3          # backtest splits of the visible profile used for strategy-aware features
  inner_fraction: 0.25
  min_history: 30
  max_history: 1000
  cv_folds: 5
  # Content-based strategy used by the label backtest and the strategy-aware features. The rich
  # bigram TF-IDF with a quality prior tripled held-out content hit-rate (scripts/content_experiments.py).
  content_options: {vectorizer: rich, quality_alpha: 2.0}

benchmark:
  # Frozen evaluation benchmark shared by the baseline and CineRankX. The split is a
  # deterministic hash of (user, movie, seed): it needs no stored state, never depends
  # on file order or sample size, and the test interactions can never change by
  # re-running or retraining. Changing seed/fractions creates a NEW benchmark.
  seed: 20260101
  train_fraction: 0.70
  validation_fraction: 0.10        # remainder (0.20) is the test split
  positive_threshold: 4.0          # a held-out rating >= this counts as "liked"
  min_train_ratings: 20            # users need this many train ratings to be evaluated
  overall_users: 2000              # test cohort, full train profile
  cold_users: 1000                 # test cohort, profile truncated to cold_history ratings
  tuning_users: 1000               # disjoint cohort scored on the VALIDATION split only
  cold_history: 5
  ks: [5, 10, 20]
  headline_k: 10                   # "accuracy" = Hit Rate@headline_k
